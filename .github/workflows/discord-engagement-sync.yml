# Manual fallback only. GitHub schedule triggers do not run reliably on many private
# repos (zero scheduled runs is common). Vercel Hobby cannot run frequent crons.
#
# Production sync: use a free external scheduler (e.g. cron-job.org) to call:
#   GET https://www.buxdao.com/api/holder-rewards/discord-engagement/sync
#   Header: Authorization: Bearer <HOLDER_REWARDS_CRON_SECRET>
#   (or x-cron-secret header, or ?key=<secret> query param on GET)
# Every 5 minutes is fine; message cooldown is 5 min anyway.

name: Discord engagement rewards

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Discord engagement
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_ANNOUNCEMENTS_CHANNEL_ID: ${{ secrets.DISCORD_ANNOUNCEMENTS_CHANNEL_ID }}
        run: npx tsx scripts/discord-engagement-sync.ts
